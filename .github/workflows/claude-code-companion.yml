name: Claude Code Companion APK

on:
  push:
    branches:
      - "**"
    paths:
      - "claude-companion/**"
      - ".github/workflows/claude-code-companion.yml"
      - "gradlew"
      - "gradle/wrapper/**"
  pull_request:
    paths:
      - "claude-companion/**"
      - ".github/workflows/claude-code-companion.yml"
      - "gradlew"
      - "gradle/wrapper/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-code-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            claude-companion/**/*.gradle
            claude-companion/gradle.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Validate bridge JavaScript
        run: node --check claude-companion/bridge/server.mjs

      - name: Build APK
        run: ./gradlew -p claude-companion :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-code-companion-debug-apk
          path: claude-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
